<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
<title id="title">An investigation loop that knows when to ask</title><desc id="desc">Proposed lifecycle · Follow observations, retain progress, and hand authority back to the user Proposed design, not implemented behavior.</desc>
<defs><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 8 5 1 9" fill="none" stroke="#1e69d6" stroke-width="1.5"/></marker><marker id="purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 8 5 1 9" fill="none" stroke="#7e57c2" stroke-width="1.5"/></marker></defs>
<rect width="1920" height="1080" fill="#fdfdff"/>
<path d="M42 80Q800 64 1535 81" fill="none" stroke="#eee9ff" stroke-width="35" stroke-linecap="round"/>
<text x="48" y="67" font-family="Chalkboard SE, Comic Sans MS, sans-serif" font-size="47" fill="#3949ab" font-weight="600">An investigation loop that knows when to ask</text>
<text x="49" y="115" font-family="Trebuchet MS, Arial, sans-serif" font-size="25" fill="#182544" font-weight="400">Proposed lifecycle · Follow observations, retain progress, and hand authority back to the user</text>
<rect x="40" y="174" width="450" height="192" rx="20" fill="#e3f2fd" fill-opacity=".48" stroke="#182544" stroke-width="2.4"/><path d="M57 179 Q265.0 175 472 181" fill="none" stroke="#3949ab" opacity=".28" stroke-width="2"/><g transform="translate(60 213) scale(0.9)" stroke="#182544" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M13 10h57l15 16v65H13Z" fill="white"/><path d="M70 10v17h15M4 0h57"/><path d="M23 40h51" stroke="#7e57c2" stroke-width="11" opacity=".28"/><path d="M24 40h47m-47 16h40m-40 16h47"/></g><text x="170" y="219" font-family="Chalkboard SE, Comic Sans MS, sans-serif" font-size="32" fill="#3949ab" font-weight="600">1  Admit the task</text><text x="170" y="260" font-family="Trebuchet MS, Arial, sans-serif" font-size="23" fill="#182544" font-weight="400">Goal + exact scope</text><text x="170" y="294" font-family="Trebuchet MS, Arial, sans-serif" font-size="23" fill="#182544" font-weight="400">Public content + finite grant</text><text x="170" y="328" font-family="Trebuchet MS, Arial, sans-serif" font-size="23" fill="#182544" font-weight="400">Check prior analysis first</text><rect x="720" y="174" width="480" height="192" rx="20" fill="#eee9ff" fill-opacity=".48" stroke="#182544" stroke-width="2.4"/><path d="M737 179 Q960.0 175 1182 181" fill="none" stroke="#3949ab" opacity=".28" stroke-width="2"/><g transform="translate(740 213) scale(0.88)" stroke="#182544" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M45 12V2m-7 0h14"/><rect x="7" y="17" width="77" height="61" rx="18" fill="#eee9ff"/><circle cx="30" cy="42" r="5" fill="#3949ab"/><circle cx="61" cy="42" r="5" fill="#3949ab"/><path d="M31 61q14 10 29 0M0 35v24m91-24v24M23 79v14m45-14v14"/></g><text x="853" y="218" font-family="Chalkboard SE, Comic Sans MS, sans-serif" font-size="30" fill="#7e57c2" font-weight="600">2  Choose next action</text><text x="853" y="261" font-family="Trebuchet MS, Arial, sans-serif" font-size="23" fill="#182544" font-weight="400">Read? Compare? Ask? Stop?</text><text x="853" y="295" font-family="Trebuchet MS, Arial, sans-serif" font-size="23" fill="#182544" font-weight="400">Use the latest observation</text><text x="853" y="329" font-family="Trebuchet MS, Arial, sans-serif" font-size="23" fill="#182544" font-weight="400">Host checks every choice</text><rect x="1420" y="174" width="460" height="192" rx="20" fill="#e3f2fd" fill-opacity=".48" stroke="#182544" stroke-width="2.4"/><path d="M1437 179 Q1650.0 175 1862 181" fill="none" stroke="#3949ab" opacity=".28" stroke-width="2"/><g transform="translate(1440 213) scale(0.9)" stroke="#182544" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" fill="none"><rect x="5" y="30" width="84" height="60" rx="8" fill="#e3f2fd"/><path d="M29 30V15h36v15M5 51h84M38 47v17h19V47"/><path d="M18 74h17m33 0h10" stroke="#3949ab"/></g><text x="1550" y="218" font-family="Chalkboard SE, Comic Sans MS, sans-serif" font-size="29" fill="#1e69d6" font-weight="600">3  Call allowed tool</text><text x="1550" y="260" font-family="Trebuchet MS, Arial, sans-serif" font-size="22" fill="#182544" font-weight="400">GitHub MCP / GHM MCP</text><text x="1550" y="294" font-family="Trebuchet MS, Arial, sans-serif" font-size="22" fill="#182544" font-weight="400">Bound source + bytes + time</text><text x="1550" y="328" font-family="Trebuchet MS, Arial, sans-serif" font-size="22" fill="#182544" font-weight="400">Return evidence or error</text><path d="M491 264H708" fill="none" stroke="#1e69d6" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#blue)"/><text x="526" y="242" font-family="Trebuchet MS, Arial, sans-serif" font-size="23" fill="#1e69d6" font-weight="400">Approved task</text><path d="M1202 264H1407" fill="none" stroke="#1e69d6" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#blue)"/><text x="1236" y="241" font-family="Trebuchet MS, Arial, sans-serif" font-size="23" fill="#1e69d6" font-weight="400">Typed action</text><rect x="720" y="546" width="480" height="184" rx="20" fill="#e3f2fd" fill-opacity=".48" stroke="#182544" stroke-width="2.4"/><path d="M737 551 Q960.0 547 1182 553" fill="none" stroke="#3949ab" opacity=".28" stroke-width="2"/><g transform="translate(741 580) scale(0.86)" stroke="#182544" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" fill="none"><circle cx="34" cy="33" r="27" fill="#e3f2fd"/><path d="m54 54 32 32" stroke-width="11"/><path d="m54 54 32 32" stroke="#7e57c2" stroke-width="6"/><path d="M20 27h27M20 39h20"/></g><text x="853" y="590" font-family="Chalkboard SE, Comic Sans MS, sans-serif" font-size="29" fill="#1e69d6" font-weight="600">4  Observe + remember</text><text x="853" y="631" font-family="Trebuchet MS, Arial, sans-serif" font-size="23" fill="#182544" font-weight="400">Validate source / status</text><text x="853" y="665" font-family="Trebuchet MS, Arial, sans-serif" font-size="23" fill="#182544" font-weight="400">Save bounded observation</text><text x="853" y="699" font-family="Trebuchet MS, Arial, sans-serif" font-size="23" fill="#182544" font-weight="400">Track progress and cost</text><path d="M1645 368V459H1163V533" fill="none" stroke="#1e69d6" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#blue)"/><text x="1445" y="505" font-family="Trebuchet MS, Arial, sans-serif" font-size="24" fill="#1e69d6" font-weight="400">Return a bounded</text><text x="1445" y="539" font-family="Trebuchet MS, Arial, sans-serif" font-size="24" fill="#1e69d6" font-weight="400">source observation</text><path d="M958 544V377" fill="none" stroke="#1e69d6" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#blue)"/><text x="690" y="433" font-family="Trebuchet MS, Arial, sans-serif" font-size="23" fill="#182544" font-weight="400">Replan from evidence.</text><text x="690" y="467" font-family="Trebuchet MS, Arial, sans-serif" font-size="23" fill="#182544" font-weight="400">Only while useful.</text><rect x="40" y="546" width="450" height="184" rx="20" fill="#eee9ff" fill-opacity=".48" stroke="#182544" stroke-width="2.4"/><path d="M57 551 Q265.0 547 472 553" fill="none" stroke="#3949ab" opacity=".28" stroke-width="2"/><g transform="translate(60 582) scale(0.87)" stroke="#182544" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="m45 4 36 13v29q0 30-36 47Q9 76 9 46V17Z" fill="#e3f2fd"/><path d="m25 46 14 14 29-31" stroke="#3949ab" stroke-width="5"/></g><text x="169" y="590" font-family="Chalkboard SE, Comic Sans MS, sans-serif" font-size="30" fill="#7e57c2" font-weight="600">Wait or stop clearly</text><text x="169" y="630" font-family="Trebuchet MS, Arial, sans-serif" font-size="22" fill="#182544" font-weight="400">Auth / rate limit / budget</text><text x="169" y="664" font-family="Trebuchet MS, Arial, sans-serif" font-size="22" fill="#182544" font-weight="400">No-progress / uncertain cost</text><text x="169" y="698" font-family="Trebuchet MS, Arial, sans-serif" font-size="22" fill="#182544" font-weight="400">Do not blindly retry</text><path d="M719 639H503" fill="none" stroke="#7e57c2" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#purple)"/><text x="533" y="617" font-family="Trebuchet MS, Arial, sans-serif" font-size="23" fill="#7e57c2" font-weight="400">Host decision</text><rect x="1420" y="797" width="460" height="188" rx="20" fill="#eee9ff" fill-opacity=".48" stroke="#182544" stroke-width="2.4"/><path d="M1437 802 Q1650.0 798 1862 804" fill="none" stroke="#3949ab" opacity=".28" stroke-width="2"/><g transform="translate(1440 835) scale(0.9)" stroke="#182544" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" fill="none"><circle cx="44" cy="22" r="18" fill="#eee9ff"/><path d="M12 88v-9q0-30 32-30t32 30v9Z" fill="#e3f2fd"/><path d="m29 77 12 10 23-27" stroke="#3949ab"/></g><text x="1552" y="842" font-family="Chalkboard SE, Comic Sans MS, sans-serif" font-size="30" fill="#7e57c2" font-weight="600">5  Human handoff</text><text x="1552" y="883" font-family="Trebuchet MS, Arial, sans-serif" font-size="22" fill="#182544" font-weight="400">Sources + unknowns + diff</text><text x="1552" y="917" font-family="Trebuchet MS, Arial, sans-serif" font-size="22" fill="#182544" font-weight="400">Approve / clarify / reject</text><text x="1552" y="951" font-family="Trebuchet MS, Arial, sans-serif" font-size="22" fill="#182544" font-weight="400">Pause survives restart</text><path d="M1200 329H1314V827H1407" fill="none" stroke="#7e57c2" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#purple)"/><text x="1340" y="688" font-family="Trebuchet MS, Arial, sans-serif" font-size="22" fill="#7e57c2" font-weight="400">Enough evidence</text><text x="1340" y="719" font-family="Trebuchet MS, Arial, sans-serif" font-size="22" fill="#7e57c2" font-weight="400">or judgement needed</text><rect x="720" y="797" width="480" height="188" rx="20" fill="#e3f2fd" fill-opacity=".48" stroke="#182544" stroke-width="2.4"/><path d="M737 802 Q960.0 798 1182 804" fill="none" stroke="#3949ab" opacity=".28" stroke-width="2"/><g transform="translate(742 833) scale(0.88)" stroke="#182544" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M15 4h64v86l-10-7-11 7-10-7-11 7-11-7-11 7Z" fill="white"/><path d="M27 23h39M27 38h39m-39 15h21m-19 16 9 8 23-24" stroke="#3949ab"/></g><text x="853" y="842" font-family="Chalkboard SE, Comic Sans MS, sans-serif" font-size="29" fill="#3949ab" font-weight="600">6  Save approved result</text><text x="853" y="883" font-family="Trebuchet MS, Arial, sans-serif" font-size="22" fill="#182544" font-weight="400">Recheck current conditions</text><text x="853" y="917" font-family="Trebuchet MS, Arial, sans-serif" font-size="22" fill="#182544" font-weight="400">Apply once + operation receipt</text><text x="853" y="951" font-family="Trebuchet MS, Arial, sans-serif" font-size="22" fill="#182544" font-weight="400">Resume safely after a crash</text><path d="M1419 891H1213" fill="none" stroke="#7e57c2" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#purple)"/><text x="1236" y="937" font-family="Trebuchet MS, Arial, sans-serif" font-size="22" fill="#7e57c2" font-weight="400">Exact approval</text><rect x="40" y="797" width="450" height="188" rx="20" fill="#e3f2fd" fill-opacity=".48" stroke="#182544" stroke-width="2.4"/><path d="M57 802 Q265.0 798 472 804" fill="none" stroke="#3949ab" opacity=".28" stroke-width="2"/><g transform="translate(60 833) scale(0.88)" stroke="#182544" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" fill="none"><rect x="9" y="5" width="75" height="85" rx="8" fill="white"/><path d="M25 5v85M2 21h15M2 40h15M2 59h15M2 78h15M36 24h35M36 42h27M36 60h35M36 78h19"/><path d="M36 42h30" stroke="#1e69d6" stroke-width="10" opacity=".24"/></g><text x="170" y="841" font-family="Chalkboard SE, Comic Sans MS, sans-serif" font-size="26" fill="#3949ab" font-weight="600">A useful saved outcome</text><text x="170" y="882" font-family="Trebuchet MS, Arial, sans-serif" font-size="22" fill="#182544" font-weight="400">Repository brief / shortlist</text><text x="170" y="916" font-family="Trebuchet MS, Arial, sans-serif" font-size="22" fill="#182544" font-weight="400">Reviewed local organization</text><text x="170" y="950" font-family="Trebuchet MS, Arial, sans-serif" font-size="22" fill="#182544" font-weight="400">Or a clear unresolved result</text><path d="M719 891H503" fill="none" stroke="#1e69d6" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#blue)"/><text x="529" y="937" font-family="Trebuchet MS, Arial, sans-serif" font-size="22" fill="#1e69d6" font-weight="400">Visible in the app</text>
<path d="M48 1020Q950 1012 1870 1020" fill="none" stroke="#3949ab" stroke-width="2" opacity=".45"/>
<text x="50" y="1058" font-family="Trebuchet MS, Arial, sans-serif" font-size="23" fill="#3949ab" font-weight="400">DESIGN PROPOSAL · Local first · No GitHub writes · Existing privacy and spending controls remain authoritative</text>
</svg>