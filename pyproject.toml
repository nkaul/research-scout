[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "research-scout"
version = "0.1.0"
description = "Provider-isolated, progressive scholarly discovery workspace"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.34",
  "httpx>=0.28",
  "pydantic>=2.10",
  "mcp>=1.10,<2",
  "deepagents>=0.7.32",
  "langchain-core>=1",
  "langgraph>=1.2.17,<2",
  "python-dotenv>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "ruff>=0.11"]
encoder = ["onnxruntime==1.23.2", "tokenizers==0.23.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "ASYNC"]

