name: Increment 1 validation

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fixture-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SCOUT_MODE: fixture
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version-file: backend/.python-version
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.8"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@v6
        with:
          node-version: "24.22.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked backend dependencies
        run: uv sync --project backend --locked
      - name: Python contracts, real MCP and isolated-process tests
        run: |
          uv run --directory backend --locked ruff check src tests scripts
          uv run --directory backend --locked pytest -q
          uv run --project backend --locked python -m research_scout.agents.evaluate --output .scout/ci-context-harness.json
      - name: Install and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm run build
          PLAYWRIGHT_BROWSERS_PATH=.browser-cache npx playwright install --with-deps chromium
      - name: Browser contracts and actual fixture-backend journey
        run: |
          uv run --project backend --locked python backend/scripts/dev.py --mode fixture --state-dir .scout/ci --no-frontend &
          scout_stack_pid=$!
          trap 'kill -TERM "$scout_stack_pid" 2>/dev/null || true' EXIT
          uv run --project backend --locked python - <<'PY'
          import time, httpx
          for attempt in range(100):
              try:
                  if httpx.get('http://127.0.0.1:8100/health', timeout=1).is_success:
                      break
              except httpx.HTTPError:
                  pass
              time.sleep(.2)
          else:
              raise SystemExit('Fixture backend did not become ready')
          PY
          cd frontend
          SCOUT_BROWSER_INTEGRATION=1 npm run test:browser
