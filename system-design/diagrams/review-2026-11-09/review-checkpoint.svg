</defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.hand{font-family:'Bradley Hand','Segoe Print',sans-serif}</style><rect width="1920" height="1280" fill="#fdfdfb"/><path d="M55 112Q580 101 1130 111T1850 107" stroke="#dbe4ff" stroke-width="18" fill="none" stroke-linecap="round"/><text x="60" y="76" fill="#3154ac" font-size="45" font-weight="650"><tspan x="60" dy="0">Review checkpoint — what we can build on</tspan></text><text x="60" y="145" fill="#53627b" font-size="23" font-weight="400"><tspan x="60" dy="0">November 9, 2026 · a review baseline, with proposed next steps rather than an implementation commitment</tspan></text><rect x="60" y="245" width="560" height="800" rx="16" fill="#f1f8f4" stroke="#d1d8e5" stroke-width="1.8"/><svg x="84" y="270" width="48" height="48" viewBox="0 0 48 48" fill="none" stroke="#2b7057" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><use href="#clipboard"/></svg><text x="148" y="301" fill="#2b7057" font-size="30" font-weight="600"><tspan x="148" dy="0">Implemented foundation</tspan></text><text x="85" y="353" fill="#2b7057" font-size="22" font-weight="400"><tspan x="85" dy="0">Fixture-proven behavior</tspan></text><path d="M86 382h508" stroke="#dbe0e9" stroke-width="1.3"/><text x="86" y="407" fill="#2b7057" font-size="25" font-weight="600"><tspan x="86" dy="0">Actual agent framework</tspan></text><text x="86" y="443" fill="#20304b" font-size="22" font-weight="400"><tspan x="86" dy="0">Two Deep Agents / LangGraph graphs.</tspan><tspan x="86" dy="31.24">Narrow tools; bounded orchestration.</tspan></text><path d="M86 501h508" stroke="#dbe0e9" stroke-width="1.3"/><text x="86" y="526" fill="#2b7057" font-size="25" font-weight="600"><tspan x="86" dy="0">Local protocols and services</tspan></text><text x="86" y="562" fill="#20304b" font-size="22" font-weight="400"><tspan x="86" dy="0">Application MCP + four provider processes.</tspan><tspan x="86" dy="31.24">HTTP / NDJSON / persisted SSE path.</tspan></text><path d="M86 620h508" stroke="#dbe0e9" stroke-width="1.3"/><text x="86" y="645" fill="#2b7057" font-size="25" font-weight="600"><tspan x="86" dy="0">Human review and durability</tspan></text><text x="86" y="681" fill="#20304b" font-size="22" font-weight="400"><tspan x="86" dy="0">Atomic JSON; revisions; independent journals.</tspan><tspan x="86" dy="31.24">Shortlist, registry checks, saved exports.</tspan></text><path d="M86 739h508" stroke="#dbe0e9" stroke-width="1.3"/><text x="86" y="764" fill="#2b7057" font-size="25" font-weight="600"><tspan x="86" dy="0">Dub-inspired application UI</tspan></text><text x="86" y="800" fill="#20304b" font-size="22" font-weight="400"><tspan x="86" dy="0">Desktop preview, tabs and phone reader.</tspan><tspan x="86" dy="31.24">Built and validated; not reachable at review.</tspan></text><path d="M86 858h508" stroke="#dbe0e9" stroke-width="1.3"/><text x="86" y="883" fill="#2b7057" font-size="25" font-weight="600"><tspan x="86" dy="0">Dated validation evidence</tspan></text><text x="86" y="919" fill="#20304b" font-size="22" font-weight="400"><tspan x="86" dy="0">Oct 26: 106 Python; 11 synthetic evals.</tspan><tspan x="86" dy="31.24">Oct 30: 9 production-browser journeys.</tspan></text><rect x="680" y="245" width="560" height="800" rx="16" fill="#fff9ee" stroke="#d1d8e5" stroke-width="1.8"/><svg x="704" y="270" width="48" height="48" viewBox="0 0 48 48" fill="none" stroke="#875b1f" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><use href="#document"/></svg><text x="768" y="301" fill="#875b1f" font-size="30" font-weight="600"><tspan x="768" dy="0">Evidence still limited</tspan></text><text x="705" y="353" fill="#875b1f" font-size="22" font-weight="400"><tspan x="705" dy="0">Do not equate fixtures with live research</tspan></text><path d="M706 382h508" stroke="#dbe0e9" stroke-width="1.3"/><text x="706" y="407" fill="#875b1f" font-size="25" font-weight="600"><tspan x="706" dy="0">OpenAlex official MCP</tspan></text><text x="706" y="443" fill="#20304b" font-size="22" font-weight="400"><tspan x="706" dy="0">Adapter and schema-contract code exist.</tspan><tspan x="706" dy="31.24">OAuth / tool / native hybrid proof pending.</tspan></text><path d="M706 501h508" stroke="#dbe0e9" stroke-width="1.3"/><text x="706" y="526" fill="#875b1f" font-size="25" font-weight="600"><tspan x="706" dy="0">Crossref + DataCite REST</tspan></text><text x="706" y="562" fill="#20304b" font-size="22" font-weight="400"><tspan x="706" dy="0">Specific metadata probes returned 200.</tspan><tspan x="706" dy="31.24">Evidence date: Oct 26; not rechecked today.</tspan></text><path d="M706 620h508" stroke="#dbe0e9" stroke-width="1.3"/><text x="706" y="645" fill="#875b1f" font-size="25" font-weight="600"><tspan x="706" dy="0">Semantic Scholar REST</tspan></text><text x="706" y="681" fill="#20304b" font-size="22" font-weight="400"><tspan x="706" dy="0">Last details probe: 429 on Oct 26.</tspan><tspan x="706" dy="31.24">Live search and encoder remain unproved.</tspan></text><path d="M706 739h508" stroke="#dbe0e9" stroke-width="1.3"/><text x="706" y="764" fill="#875b1f" font-size="25" font-weight="600"><tspan x="706" dy="0">AI reasoning and search quality</tspan></text><text x="706" y="800" fill="#20304b" font-size="22" font-weight="400"><tspan x="706" dy="0">Only a scripted BaseChatModel runs.</tspan><tspan x="706" dy="31.24">No live relevance / entailment evaluation.</tspan></text><path d="M706 858h508" stroke="#dbe0e9" stroke-width="1.3"/><text x="706" y="883" fill="#875b1f" font-size="25" font-weight="600"><tspan x="706" dy="0">Durable graph continuation</tspan></text><text x="706" y="919" fill="#20304b" font-size="22" font-weight="400"><tspan x="706" dy="0">JSON stores application state, not graph steps.</tspan><tspan x="706" dy="31.24">No LangGraph checkpointer is configured.</tspan></text><rect x="1300" y="245" width="560" height="800" rx="16" fill="#f6f1fc" stroke="#d1d8e5" stroke-width="1.8"/><svg x="1324" y="270" width="48" height="48" viewBox="0 0 48 48" fill="none" stroke="#7253aa" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><use href="#filter"/></svg><text x="1388" y="301" fill="#7253aa" font-size="30" font-weight="600"><tspan x="1388" dy="0">Next review decisions</tspan></text><text x="1325" y="353" fill="#7253aa" font-size="22" font-weight="400"><tspan x="1325" dy="0">Proposed dependency order</tspan></text><path d="M1326 382h508" stroke="#dbe0e9" stroke-width="1.3"/><text x="1326" y="407" fill="#7253aa" font-size="25" font-weight="600"><tspan x="1326" dy="0">1 · Make modes explicit</tspan></text><text x="1326" y="443" fill="#20304b" font-size="22" font-weight="400"><tspan x="1326" dy="0">Separate provider data mode from model mode.</tspan><tspan x="1326" dy="31.24">Current provider-live path can stay scripted.</tspan></text><path d="M1326 501h508" stroke="#dbe0e9" stroke-width="1.3"/><text x="1326" y="526" fill="#7253aa" font-size="25" font-weight="600"><tspan x="1326" dy="0">2 · Prove the primary connection</tspan></text><text x="1326" y="562" fill="#20304b" font-size="22" font-weight="400"><tspan x="1326" dy="0">Authorize OpenAlex; inspect actual tool schemas.</tspan><tspan x="1326" dy="31.24">Run bounded lexical / semantic / filter cases.</tspan></text><path d="M1326 620h508" stroke="#dbe0e9" stroke-width="1.3"/><text x="1326" y="645" fill="#7253aa" font-size="25" font-weight="600"><tspan x="1326" dy="0">3 · Introduce one real model</tspan></text><text x="1326" y="681" fill="#20304b" font-size="22" font-weight="400"><tspan x="1326" dy="0">Choose model, tool profile and cost accounting.</tspan><tspan x="1326" dy="31.24">Validate the one-question-to-shortlist journey.</tspan></text><path d="M1326 739h508" stroke="#dbe0e9" stroke-width="1.3"/><text x="1326" y="764" fill="#7253aa" font-size="25" font-weight="600"><tspan x="1326" dy="0">4 · Measure, then broaden</tspan></text><text x="1326" y="800" fill="#20304b" font-size="22" font-weight="400"><tspan x="1326" dy="0">Reviewed live questions + registry-check cases.</tspan><tspan x="1326" dy="31.24">Optional S2 access / compatible pool reranker.</tspan></text><path d="M1326 858h508" stroke="#dbe0e9" stroke-width="1.3"/><text x="1326" y="883" fill="#7253aa" font-size="25" font-weight="600"><tspan x="1326" dy="0">Later · Production and more content</tspan></text><text x="1326" y="919" fill="#20304b" font-size="22" font-weight="400"><tspan x="1326" dy="0">Database, identity and deployment decisions.</tspan><tspan x="1326" dy="31.24">Full-text / PDF / web / video remain future.</tspan></text><rect x="60" y="1100" width="1800" height="125" rx="16" fill="#eef2ff" stroke="#b8c8eb" stroke-width="1.8"/><text x="88" y="1145" fill="#3154ac" font-size="29" font-weight="600"><tspan x="88" dy="0">Starting point: the local framework and UX exist; live research acceptance is not yet demonstrated.</tspan></text><text x="88" y="1189" fill="#20304b" font-size="24" font-weight="400"><tspan x="88" dy="0">First useful live slice: one question → OpenAlex hybrid results → a real model’s bounded output → human shortlist → saved export.</tspan></text></svg>