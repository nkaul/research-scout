<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1280" viewBox="0 0 1920 1280" role="img" aria-labelledby="title desc"><title id="title">Research Scout review checkpoint</title><desc id="desc">Three columns distinguish the fixture-proven implementation, limited external evidence and proposed next decisions. The first useful live slice still needs OpenAlex and real-model proof.</desc><defs><marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10" fill="#3154ac"/></marker><marker id="green-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10" fill="#2b7057"/></marker><marker id="amber-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10" fill="#875b1f"/></marker><marker id="red-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10" fill="#9c4547"/></marker><marker id="purple-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10" fill="#7253aa"/></marker>
<symbol id="browser"><rect x="4" y="7" width="40" height="31" rx="4"/><path d="M4 15h40M10 11h.1M15 11h.1M20 11h.1M19 43h10M24 38v5M10 21h9v12h-9M24 21h13M24 27h13M24 33h9"/></symbol>
<symbol id="robot"><rect x="7" y="12" width="34" height="27" rx="8"/><path d="M24 5v7M21 5h6M2 24h5M41 24h5M15 44v-5M33 44v-5M17 31c4 3 10 3 14 0"/><circle cx="17" cy="22" r="2"/><circle cx="31" cy="22" r="2"/></symbol>
