<symbol id="clipboard"><rect x="9" y="7" width="30" height="37" rx="4"/><rect x="17" y="3" width="14" height="9" rx="3" fill="white"/><path d="m15 22 3 3 5-6M27 22h6m-18 11 3 3 5-6M27 33h6"/></symbol>
</defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.hand{font-family:'Bradley Hand','Segoe Print',sans-serif}</style><rect width="1920" height="1280" fill="#fdfdfb"/><path d="M55 112Q580 101 1130 111T1850 107" stroke="#dbe4ff" stroke-width="18" fill="none" stroke-linecap="round"/><text x="60" y="76" fill="#3154ac" font-size="45" font-weight="650"><tspan x="60" dy="0">What the agent workflow actually does</tspan></text><text x="60" y="145" fill="#53627b" font-size="23" font-weight="400"><tspan x="60" dy="0">Two compiled graphs, one bound delegation, one application search — real orchestration with a scripted model</tspan></text><rect x="60" y="176" width="244" height="36" rx="9" fill="#eef3ff" stroke="#3154ac" stroke-width="1.8"/><text x="74" y="201" fill="#3154ac" font-size="20" font-weight="550"><tspan x="74" dy="0">Deep Agents 0.7.32</tspan></text><rect x="365" y="176" width="208" height="36" rx="9" fill="#eef3ff" stroke="#3154ac" stroke-width="1.8"/><text x="379" y="201" fill="#3154ac" font-size="20" font-weight="550"><tspan x="379" dy="0">LangChain 1.4.7</tspan></text><rect x="660" y="176" width="220" height="36" rx="9" fill="#f4efff" stroke="#7253aa" stroke-width="1.8"/><text x="674" y="201" fill="#7253aa" font-size="20" font-weight="550"><tspan x="674" dy="0">LangGraph 1.2.17</tspan></text><rect x="970" y="176" width="280" height="36" rx="9" fill="#fff0ee" stroke="#9c4547" stroke-width="1.8"/><text x="984" y="201" fill="#9c4547" font-size="20" font-weight="550"><tspan x="984" dy="0">No hosted model calls</tspan></text><g data-bounds="60,260,560,350"><rect x="60" y="260" width="560" height="350" rx="16" fill="#fff" stroke="#bdcbe5" stroke-width="1.8"/><rect x="76" y="277" width="49" height="49" rx="20" fill="#eef2ff" stroke="#3154ac" stroke-width="1.8"/><text x="90" y="311" fill="#3154ac" font-size="29" font-weight="650"><tspan x="90" dy="0">1</tspan></text><svg x="548" y="280" width="45" height="45" viewBox="0 0 48 48" fill="none" stroke="#3154ac" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><use href="#clipboard"/></svg><text x="84" y="366" fill="#3154ac" font-size="30" font-weight="600"><tspan x="84" dy="0">Bind the research task</tspan></text><text x="84" y="412" fill="#20304b" font-size="24" font-weight="400"><tspan x="84" dy="0">Question + one provider + hard filters.</tspan><tspan x="84" dy="34.08">Save scope; admit one execution.</tspan><tspan x="84" dy="34.08">Both branches use the same question.</tspan><tspan x="84" dy="34.08">No LLM query planner is implemented.</tspan></text></g><g data-bounds="680,260,560,350"><rect x="680" y="260" width="560" height="350" rx="16" fill="#fff" stroke="#bdcbe5" stroke-width="1.8"/><rect x="696" y="277" width="49" height="49" rx="20" fill="#eef2ff" stroke="#7253aa" stroke-width="1.8"/><text x="710" y="311" fill="#7253aa" font-size="29" font-weight="650"><tspan x="710" dy="0">2</tspan></text><svg x="1168" y="280" width="45" height="45" viewBox="0 0 48 48" fill="none" stroke="#7253aa" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><use href="#robot"/></svg><text x="704" y="366" fill="#7253aa" font-size="30" font-weight="600"><tspan x="704" dy="0">Coordinator graph</tspan></text><text x="704" y="412" fill="#20304b" font-size="24" font-weight="400"><tspan x="704" dy="0">Generation 1 → delegate_discovery().</tspan><tspan x="704" dy="34.08">One provider-bound handoff.</tspan><tspan x="704" dy="34.08">No arbitrary subagent task tool.</tspan><tspan x="704" dy="34.08">LangGraph executes the compiled graph.</tspan></text></g><g data-bounds="1300,260,560,350"><rect x="1300" y="260" width="560" height="350" rx="16" fill="#fff" stroke="#bdcbe5" stroke-width="1.8"/><rect x="1316" y="277" width="49" height="49" rx="20" fill="#eef2ff" stroke="#7253aa" stroke-width="1.8"/><text x="1330" y="311" fill="#7253aa" font-size="29" font-weight="650"><tspan x="1330" dy="0">3</tspan></text><svg x="1788" y="280" width="45" height="45" viewBox="0 0 48 48" fill="none" stroke="#7253aa" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><use href="#plug"/></svg><text x="1324" y="366" fill="#7253aa" font-size="30" font-weight="600"><tspan x="1324" dy="0">Discovery specialist</tspan></text><text x="1324" y="412" fill="#20304b" font-size="24" font-weight="400"><tspan x="1324" dy="0">Generation 2 → search_papers().</tspan><tspan x="1324" dy="34.08">Its model-facing tool takes no args.</tspan><tspan x="1324" dy="34.08">The closure binds the saved run ID.</tspan><tspan x="1324" dy="34.08">Actual MCP ClientSession calls the core.</tspan></text></g><g data-bounds="1300,690,560,350"><rect x="1300" y="690" width="560" height="350" rx="16" fill="#fff" stroke="#bdcbe5" stroke-width="1.8"/><rect x="1316" y="707" width="49" height="49" rx="20" fill="#eef2ff" stroke="#3154ac" stroke-width="1.8"/><text x="1330" y="741" fill="#3154ac" font-size="29" font-weight="650"><tspan x="1330" dy="0">4</tspan></text><svg x="1788" y="710" width="45" height="45" viewBox="0 0 48 48" fill="none" stroke="#3154ac" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><use href="#filter"/></svg><text x="1324" y="796" fill="#3154ac" font-size="30" font-weight="600"><tspan x="1324" dy="0">Retrieve, validate, publish</tspan></text><text x="1324" y="842" fill="#20304b" font-size="24" font-weight="400"><tspan x="1324" dy="0">Core → one selected provider service.</tspan><tspan x="1324" dy="34.08">Lexical + semantic branches run.</tspan><tspan x="1324" dy="34.08">Core filters, deduplicates and fuses ranks.</tspan><tspan x="1324" dy="34.08">Saved observations → SSE → early UI.</tspan><tspan x="1324" dy="34.08">Rows do not wait for a final summary.</tspan></text></g><g data-bounds="680,690,560,350"><rect x="680" y="690" width="560" height="350" rx="16" fill="#fff" stroke="#bdcbe5" stroke-width="1.8"/><rect x="696" y="707" width="49" height="49" rx="20" fill="#eef2ff" stroke="#3154ac" stroke-width="1.8"/><text x="710" y="741" fill="#3154ac" font-size="29" font-weight="650"><tspan x="710" dy="0">5</tspan></text><svg x="1168" y="710" width="45" height="45" viewBox="0 0 48 48" fill="none" stroke="#3154ac" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><use href="#document"/></svg><text x="704" y="796" fill="#3154ac" font-size="30" font-weight="600"><tspan x="704" dy="0">Pack context &amp; validate</tspan></text><text x="704" y="842" fill="#20304b" font-size="24" font-weight="400"><tspan x="704" dy="0">Specialist wrapper packs saved records.</tspan><tspan x="704" dy="34.08">Generation 3 reads compact tool results.</tspan><tspan x="704" dy="34.08">Keep every admitted source ID/version.</tspan><tspan x="704" dy="34.08">Fit optional title / abstract previews.</tspan><tspan x="704" dy="34.08">Reject foreign or invented references.</tspan><tspan x="704" dy="34.08">Return bounded JSON + a scripted note.</tspan></text></g><g data-bounds="60,690,560,350"><rect x="60" y="690" width="560" height="350" rx="16" fill="#fff" stroke="#bdcbe5" stroke-width="1.8"/><rect x="76" y="707" width="49" height="49" rx="20" fill="#eef2ff" stroke="#7253aa" stroke-width="1.8"/><text x="90" y="741" fill="#7253aa" font-size="29" font-weight="650"><tspan x="90" dy="0">6</tspan></text><svg x="548" y="710" width="45" height="45" viewBox="0 0 48 48" fill="none" stroke="#7253aa" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><use href="#person"/></svg><text x="84" y="796" fill="#7253aa" font-size="30" font-weight="600"><tspan x="84" dy="0">Return to human review</tspan></text><text x="84" y="842" fill="#20304b" font-size="24" font-weight="400"><tspan x="84" dy="0">Generation 4 → coordinator result.</tspan><tspan x="84" dy="34.08">Core validates and saves final status.</tspan><tspan x="84" dy="34.08">People control shortlist and reasons.</tspan><tspan x="84" dy="34.08">DOI checks / exports use the API.</tspan><tspan x="84" dy="34.08">Registry agreement ≠ scientific validity.</tspan></text></g><path d="M620 430H678" fill="none" stroke="#7253aa" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#purple-arrow)"/><path d="M1240 430H1298" fill="none" stroke="#7253aa" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#purple-arrow)"/><path d="M1580 610V688" fill="none" stroke="#7253aa" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#purple-arrow)"/><path d="M1300 865H1242" fill="none" stroke="#3154ac" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#blue-arrow)"/><path d="M680 865H622" fill="none" stroke="#3154ac" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#blue-arrow)"/><rect x="60" y="1110" width="1800" height="105" rx="16" fill="#f4f7fc" stroke="#cbd7ec" stroke-width="1.8"/><text x="86" y="1152" fill="#3154ac" font-size="27" font-weight="600"><tspan x="86" dy="0">Harness: 4 scripted generations on the happy path; cap 6 · 1 delegation · 1 application search</tspan></text><text x="86" y="1191" fill="#20304b" font-size="23" font-weight="400"><tspan x="86" dy="0">Context limits are fixture UTF-8 byte units, not live tokens. Graph messages are transient; saved app state prevents automatic replay.</tspan></text></svg>